[project]
name = "candidate-scoring"
version = "0.1.0"
description = "Scores and ranks prospective Boutique owners for Celebrity Management"
requires-python = ">=3.11"
dependencies = [
    "litai>=0.0.10",
    "pydantic>=2.7",
    "numpy>=1.26",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
score = "candidate_scoring.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candidate_scoring"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer.Option/Argument in defaults is the library's intended usage.
# UP042: str-Enum is deliberate - it keeps enum values JSON-serialisable as-is.
ignore = ["B008", "UP042"]
